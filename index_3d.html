<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HF RFID Coverage AR</title>
  <!-- Load A-Frame and AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Load Three.js SVGLoader -->
  <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/SVGLoader.js"></script>

  <style>
    .ui-panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000; 
      background: rgba(255, 255, 255, 0.9); padding: 15px; 
      border-radius: 8px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      max-height: 90vh; overflow-y: auto;
    }
    .ui-panel label { display: block; margin-top: 8px; font-size: 14px; font-weight: bold; }
    .ui-panel select, .ui-panel input { 
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 5px; 
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- User Interface -->
  <div class="ui-panel">
    <label>Anchor Size (mm)</label>
    <input type="number" id="anchor-size" value="93" min="1" step="1">

    <label>Reader</label>
    <select id="reader">
      <option value="IQx3" selected>IQx3</option>
      <option value="IQx4">IQx4</option>
    </select>

    <label>Form Factor</label>
    <select id="form-factor">
      <option value="FP" selected>FP</option>
      <option value="F61">F61</option>
      <option value="18GM">18GM</option>
      <option value="F198">F198</option>
    </select>

    <label>Tag-Chip</label>
    <select id="tag-chip">
      <option value="IQC21" selected>IQC21</option>
      <option value="IQC22">IQC22</option>
      <option value="IQC33">IQC33</option>
      <option value="IQC50">IQC50</option>
    </select>

    <label>Tag Form Factor</label>
    <select id="tag-form">
      <!-- Options populated dynamically by JS based on Tag-Chip -->
    </select>

    <label>Transmission Power</label>
    <select id="power">
      <option value="PT1">PT1</option>
      <option value="PT2">PT2</option>
      <option value="PT3">PT3</option>
      <option value="PT4" selected>PT4</option>
    </select>

    <label>Height Offset</label>
    <select id="offset">
      <option value="0" selected>0mm (Flush)</option>
      <option value="10">10mm</option>
      <option value="20">20mm</option>
    </select>
  </div>

  <!-- AR Scene -->
  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    
    <!-- URL points to your trained pattern file -->
    <a-marker 
      id="ar-marker" 
      type="pattern" 
      url="pattern-Assym_F.patt" 
      patternRatio="0.5" 
      size="0.093"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.02"
      smoothThreshold="5">
      
      <!-- Container handles the physical offset along the Y-axis (normal to the marker) -->
      <a-entity id="map-container" position="0 0 0">
        
        <!-- rotation="0 0 0" projects the coverage map outward toward the camera -->
        <a-entity id="svg-layer" dynamic-svg="" rotation="0 0 0"></a-entity>
        
      </a-entity>

    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // 1. Custom A-Frame Component to render and scale SVGs dynamically
    AFRAME.registerComponent('dynamic-svg', {
      schema: { 
        src: { type: 'string', default: '' },
        markerSize: { type: 'number', default: 46 }
      },
      
      init: function () {
        this.svgGroup = null;
      },

      update: function (oldData) {
        const el = this.el;
        const markerSize = this.data.markerSize > 0 ? this.data.markerSize : 46;
        const scaleFactor = 1 / markerSize;

        // If only markerSize changed and SVG is already loaded, update scale without reloading
        if (this.data.src === oldData.src && this.svgGroup) {
          this.svgGroup.scale.set(scaleFactor, -scaleFactor, scaleFactor);
          return;
        }

        if (!this.data.src) return;

        // Clear previous SVG mesh
        while (el.object3D.children.length > 0) {
          el.object3D.remove(el.object3D.children[0]);
        }

        const self = this;
        const loader = new THREE.SVGLoader();
        loader.load(this.data.src, function (data) {
          const paths = data.paths;
          const group = new THREE.Group();
          
          // Convert mm coordinates into AR.js units (1 AR unit = markerSize mm)
          group.scale.set(scaleFactor, -scaleFactor, scaleFactor);
          
          for (let i = 0; i < paths.length; i++) {
            const path = paths[i];
// Changed to MeshStandardMaterial so the 3D volume reacts to light
            const material = new THREE.MeshStandardMaterial({
              color: path.color,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.5,
              depthWrite: false
            });
            
            const shapes = THREE.SVGLoader.createShapes(path);
            for (let j = 0; j < shapes.length; j++) {
              
              // Define the 3D thickness (150mm)
              const extrudeSettings = {
                depth: 20, 
                bevelEnabled: false // Keeps the mathematical edges sharp
              };
              
              // Upgrade from flat 2D to 3D extruded volume
              const geometry = new THREE.ExtrudeGeometry(shapes[j], extrudeSettings);
              
              // Shift the geometry so the marker sits in the exact middle of the 150mm thickness
              geometry.translate(0, 0, -extrudeSettings.depth/2);
              
              const mesh = new THREE.Mesh(geometry, material);
              group.add(mesh);
            }
          }
          self.svgGroup = group;
          el.object3D.add(group);
        }, 
        undefined, 
        function (error) {
          console.warn('SVG Map not found for this configuration:', error);
        });
      }
    });

    // 2. UI References
    const ui = {
      anchorSize: document.getElementById('anchor-size'),
      reader: document.getElementById('reader'),
      formFactor: document.getElementById('form-factor'),
      tagChip: document.getElementById('tag-chip'),
      tagForm: document.getElementById('tag-form'),
      power: document.getElementById('power'),
      offset: document.getElementById('offset'),
      marker: document.getElementById('ar-marker'),
      container: document.getElementById('map-container'),
      svgLayer: document.getElementById('svg-layer')
    };

    const tagFormOptions = {
      'IQC21': ['IQC21-50', 'IQC21-30'],
      'IQC22': ['IQC22-C1', 'IQC22-22'],
      'IQC33': ['IQC33-50'],
      'IQC50': ['IQC50-50']
    };

    function updateTagFormDropdown() {
      const chip = ui.tagChip.value;
      ui.tagForm.innerHTML = '';
      
      tagFormOptions[chip].forEach(option => {
        const opt = document.createElement('option');
        opt.value = option;
        opt.textContent = option;
        ui.tagForm.appendChild(opt);
      });
      refreshAR();
    }

function refreshAR() {
  const markerSizeMm = parseFloat(ui.anchorSize.value) || 93;
  const newSizeStr = (markerSizeMm / 1000).toString();

  // 1. Force AR.js to update tracking by swapping the marker element
  if (ui.marker.getAttribute('size') !== newSizeStr) {
    const scene = ui.marker.parentNode;
    const newMarker = document.createElement('a-marker');
    
    // Copy all attributes from the old marker
    for (let attr of ui.marker.attributes) {
      newMarker.setAttribute(attr.name, attr.value);
    }
    
    // Apply the new physical size for the camera
    newMarker.setAttribute('size', newSizeStr);
    
    // Move the 3D content container into the new marker
    newMarker.appendChild(ui.container);
    
    // Swap the markers in the DOM and update the UI reference
    scene.replaceChild(newMarker, ui.marker);
    ui.marker = newMarker;
  }

  // 2. Update SVG source and dynamic marker scale
  const filename = `SVG/${ui.reader.value}_${ui.formFactor.value}_${ui.tagForm.value}_${ui.power.value}.svg`;
  ui.svgLayer.setAttribute('dynamic-svg', {
    src: filename,
    markerSize: markerSizeMm
  });
  
  // 3. Calculate Y-axis offset relative to the marker's local coordinate frame
  const offsetMm = parseFloat(ui.offset.value) || 0;
  const yOffsetARUnits = offsetMm / markerSizeMm;
  ui.container.setAttribute('position', `0 ${yOffsetARUnits} 0`);
}
    // Attach listeners
    ui.anchorSize.addEventListener('input', refreshAR);
    ui.reader.addEventListener('change', refreshAR);
    ui.formFactor.addEventListener('change', refreshAR);
    ui.tagChip.addEventListener('change', updateTagFormDropdown);
    ui.tagForm.addEventListener('change', refreshAR);
    ui.power.addEventListener('change', refreshAR);
    ui.offset.addEventListener('change', refreshAR);

    // Initialize
    updateTagFormDropdown();
  </script>
</body>
</html>
