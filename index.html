<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HF RFID Coverage AR</title>
  <!-- Load A-Frame and AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Load Three.js SVGLoader -->
  <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/SVGLoader.js"></script>

  <style>
    .ui-panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000; 
      background: rgba(255, 255, 255, 0.9); padding: 15px; 
      border-radius: 8px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .ui-panel label { display: block; margin-top: 8px; font-size: 14px; font-weight: bold; }
    .ui-panel select { width: 100%; margin-top: 4px; padding: 5px; }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- User Interface -->
  <div class="ui-panel">
    <label>Reader</label>
    <select id="reader">
      <option value="IQx3" selected>IQx3</option>
      <option value="IQx4">IQx4</option>
    </select>

    <label>Form Factor</label>
    <select id="form-factor">
      <option value="FP" selected>FP</option>
      <option value="F61">F61</option>
      <option value="18GM">18GM</option>
      <option value="F198">F198</option>
      <!-- Placeholders for future form factors -->
    </select>

    <label>Tag-Chip</label>
    <select id="tag-chip">
      <option value="IQC21" selected>IQC21</option>
      <option value="IQC33">IQC33</option>
      <option value="IQC50">IQC50</option>
    </select>

    <label>Tag Form Factor</label>
    <select id="tag-form">
      <!-- Options populated dynamically by JS based on Tag-Chip -->
    </select>

    <label>Transmission Power</label>
    <select id="power">
      <option value="PT1">PT1</option>
      <option value="PT2">PT2</option>
      <option value="PT3">PT3</option>
      <option value="PT4" selected>PT4</option>
    </select>

    <label>Height Offset</label>
    <select id="offset">
      <option value="0" selected>0mm (Flush)</option>
      <option value="10">10mm</option>
      <option value="20">20mm</option>
    </select>
  </div>

  <!-- AR Scene -->
  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Link to your trained QR Code pattern file -->
    <!-- Define the size as exactly 0.05 meters (50mm) -->
    <a-marker type="pattern" url="pattern-Assym_F.patt" patternRatio="0.5" size="0.046">
      
      <!-- Container handles the physical 10mm/20mm Y-axis offset above the QR code -->
      <a-entity id="map-container" position="0 0 0">
        
        <!-- Custom component loads the dynamically generated SVG filename -->
        <!-- Rotation -90 on X lays the 2D SVG flat onto the table plane -->
        <a-entity id="svg-layer" dynamic-svg="" rotation="-90 0 0"></a-entity>
        
      </a-entity>

    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // 1. Custom A-Frame Component to render SVGs as 3D geometry
    AFRAME.registerComponent('dynamic-svg', {
      schema: { src: { type: 'string', default: '' } },
      
      update: function (oldData) {
        if (!this.data.src || this.data.src === oldData.src) return;
        const el = this.el;
        
        // Clear previous SVG mesh
        while (el.object3D.children.length > 0) {
          el.object3D.remove(el.object3D.children[0]);
        }

        const loader = new THREE.SVGLoader();
        loader.load(this.data.src, function (data) {
          const paths = data.paths;
          const group = new THREE.Group();
          
          // Apply 0.001 scale to convert millimeter SVG coordinates to AR meters
          group.scale.set(0.001, -0.001, 0.001); // Negative Y flips the SVG right-side up
          
          for (let i = 0; i < paths.length; i++) {
            const path = paths[i];
            const material = new THREE.MeshBasicMaterial({
              color: path.color,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.5,
              depthWrite: false
            });
            const shapes = THREE.SVGLoader.createShapes(path);
            for (let j = 0; j < shapes.length; j++) {
              const geometry = new THREE.ShapeGeometry(shapes[j]);
              const mesh = new THREE.Mesh(geometry, material);
              group.add(mesh);
            }
          }
          el.object3D.add(group);
        }, 
        undefined, 
        function (error) {
          console.warn('SVG Map not found for this configuration:', error);
        });
      }
    });

    // 2. UI Logic and Event Listeners
    const ui = {
      reader: document.getElementById('reader'),
      formFactor: document.getElementById('form-factor'),
      tagChip: document.getElementById('tag-chip'),
      tagForm: document.getElementById('tag-form'),
      power: document.getElementById('power'),
      offset: document.getElementById('offset'),
      container: document.getElementById('map-container'),
      svgLayer: document.getElementById('svg-layer')
    };

    const tagFormOptions = {
      'IQC21': ['IQC21-50', /* Placeholders: 'IQC21-30' */],
      'IQC33': ['IQC33-50', /* Placeholders: 'IQC33-16' */],
      'IQC50': ['IQC50-50', /* Placeholders: 'IQC50-30' */]
    };

    function updateTagFormDropdown() {
      const chip = ui.tagChip.value;
      ui.tagForm.innerHTML = '';
      
      tagFormOptions[chip].forEach(option => {
        const opt = document.createElement('option');
        opt.value = option;
        opt.textContent = option;
        ui.tagForm.appendChild(opt);
      });
      refreshAR();
    }

    function refreshAR() {
      // Construct filename: IQx3_FP_IQC21-50_PT4.svg
      const filename = `${ui.reader.value}_${ui.formFactor.value}_${ui.tagForm.value}_${ui.power.value}.svg`;
      ui.svgLayer.setAttribute('dynamic-svg', 'src', filename);
      
      // Update Y-axis offset (convert mm to meters for AR space)
      const yOffsetMeters = parseInt(ui.offset.value) / 1000;
      ui.container.setAttribute('position', `0 ${yOffsetMeters} 0`);
    }

    // Attach listeners
    ui.reader.addEventListener('change', refreshAR);
    ui.formFactor.addEventListener('change', refreshAR);
    ui.tagChip.addEventListener('change', updateTagFormDropdown);
    ui.tagForm.addEventListener('change', refreshAR);
    ui.power.addEventListener('change', refreshAR);
    ui.offset.addEventListener('change', refreshAR);

    // Initialize
    updateTagFormDropdown();
  </script>
</body>
</html>
